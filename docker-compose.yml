services:
  backend:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./results_kor:/app/results_kor
      - ./contexts_kor:/app/contexts_kor
      - ./analyze_results:/app/analyze_results
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - backend
